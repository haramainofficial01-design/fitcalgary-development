services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fitcalgary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitcalgary_dev}
      POSTGRES_DB: fitcalgary
    ports: ["5432:5432"]
    volumes:
      - fitcalgary-postgres:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-keycloak.sql:ro
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U fitcalgary"], interval: 5s, timeout: 3s, retries: 20}
  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-fitcalgary}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-fitcalgary_dev}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:-change-this-development-password}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      FITCALGARY_WEB_CLIENT_SECRET: ${FITCALGARY_WEB_CLIENT_SECRET:-local-development-only-change-me}
    ports: ["8080:8080"]
    volumes: ["./keycloak/fitcalgary-realm.json:/opt/keycloak/data/import/fitcalgary-realm.json:ro"]
    depends_on: {postgres: {condition: service_healthy}}
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fitcalgary}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-replace-this-development-secret}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["fitcalgary-minio:/data"]
  create-bucket:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-c"]
    command: ["until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do sleep 2; done; mc mb --ignore-existing local/fitcalgary-private; mc anonymous set none local/fitcalgary-private"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fitcalgary}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-replace-this-development-secret}
  api:
    build:
      context: ..
      dockerfile: services/api-go/Dockerfile
    environment:
      APP_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-fitcalgary}:${POSTGRES_PASSWORD:-fitcalgary_dev}@postgres:5432/fitcalgary?sslmode=disable
      KEYCLOAK_ISSUER: http://keycloak:8080/realms/fitcalgary
      KEYCLOAK_AUDIENCE: fitcalgary-api
      WEB_PUBLIC_URL: http://localhost:3000
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ca-central-1
      S3_BUCKET: fitcalgary-private
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-fitcalgary}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-replace-this-development-secret}
      SIGNED_URL_TTL_SECONDS: 300
      MAX_EVIDENCE_BYTES: 4294967296
      EVIDENCE_RETENTION_DAYS: 14
      DEVICE_TOKEN_ENCRYPTION_KEY: ${DEVICE_TOKEN_ENCRYPTION_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    ports: ["4000:4000"]
    depends_on:
      postgres: {condition: service_healthy}
      keycloak: {condition: service_started}
      create-bucket: {condition: service_completed_successfully}
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["1025:1025", "8025:8025"]
volumes: {fitcalgary-postgres: {}, fitcalgary-minio: {}}
